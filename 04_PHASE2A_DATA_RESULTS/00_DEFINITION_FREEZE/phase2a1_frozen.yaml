project:
  name: AJSE_sparse_FCD_rolling_v1
  paper_scope: reliability_audited_sparse_fcd_rolling_origin
  formal_result_role: primary_retrospective_rolling_origin
  independent_blind_test_claim: prohibited
  other_paper_crg_tcn_assets_allowed: false

data:
  timezone: Asia/Kuala_Lumpur
  raw_start: '2025-12-08 13:15:00'
  raw_end: '2026-02-28 23:45:00'
  hourly_grid_start: '2025-12-08 14:00:00'
  hourly_grid_end: '2026-02-28 23:00:00'
  speed_min_exclusive_kmh: 0
  speed_max_inclusive_kmh: 130
  confidence_min_inclusive: 0.80
  confidence_max_inclusive: 1.00
  provider_status: NOT_APPLICABLE_COLUMN_ABSENT
  traffic_state_is_quality_filter: false
  duplicate_key: [node_id, quarter_hour]
  duplicate_aggregation: arithmetic_mean_after_quality_filter
  hourly_primary_rule: 2_of_4
  hourly_sensitivity_rules: [1_of_4, 3_of_4, 4_of_4]

target:
  definition: future_window_mean_speed
  horizons_hours: [1, 3, 6]
  required_observed_hours:
    H1: 1
    H3: 3
    H6: 5
  h6_sensitivity_required_observed_hours: 6
  target_imputation: prohibited
  split_assignment: forecast_origin
  purge_rule: full_target_window_must_remain_in_split
  extra_embargo_hours: 0

history:
  contiguous_hours: 24
  longer_lags_allowed: false
  weekly_context_allowed: false
  causal_forward_fill: true
  fallback_1: fold_train_node_median
  fallback_2: fold_train_corridor_median
  backward_fill: prohibited
  centered_rolling: prohibited
  scaler_fit_scope: fold_train_only

features:
  sequence_order:
    - input_speed_filled
    - hourly_missing_mask
    - imputed_flag
    - hours_since_last_observation
    - history_coverage_ratio
    - history_imputation_ratio
    - max_gap_24h
    - volatility_24h
    - hour_sin
    - hour_cos
    - dow_sin
    - dow_cos
    - weekend_flag
  sequence_shape: [24, 13]
  tabular_representation: flattened_sequence_plus_node_order_latitude_longitude

folds:
  - fold: 1
    train: ['2025-12-09 00:00:00', '2026-01-12 00:00:00']
    validation: ['2026-01-12 00:00:00', '2026-01-19 00:00:00']
    test: ['2026-01-19 00:00:00', '2026-01-26 00:00:00']
  - fold: 2
    train: ['2025-12-09 00:00:00', '2026-01-19 00:00:00']
    validation: ['2026-01-19 00:00:00', '2026-01-26 00:00:00']
    test: ['2026-01-26 00:00:00', '2026-02-02 00:00:00']
  - fold: 3
    train: ['2025-12-09 00:00:00', '2026-01-26 00:00:00']
    validation: ['2026-01-26 00:00:00', '2026-02-02 00:00:00']
    test: ['2026-02-02 00:00:00', '2026-02-09 00:00:00']
  - fold: 4
    train: ['2025-12-09 00:00:00', '2026-02-02 00:00:00']
    validation: ['2026-02-02 00:00:00', '2026-02-09 00:00:00']
    test: ['2026-02-09 00:00:00', '2026-02-16 00:00:00']
  - fold: 5
    train: ['2025-12-09 00:00:00', '2026-02-09 00:00:00']
    validation: ['2026-02-09 00:00:00', '2026-02-16 00:00:00']
    test: ['2026-02-16 00:00:00', '2026-02-23 00:00:00']
  - fold: 6
    train: ['2025-12-09 00:00:00', '2026-02-16 00:00:00']
    validation: ['2026-02-16 00:00:00', '2026-02-23 00:00:00']
    test: ['2026-02-23 00:00:00', '2026-03-01 00:00:00']

models:
  formal_set: [HA, SeasonalHA, Persistence, Ridge, XGBoost, GRU]
  rationale: six-model benchmark aligned with AJSE outline; one lightweight sequence model; CRG-TCN excluded
  stochastic_seeds: [42, 2026, 3407]
  deterministic_seed: 42
  ridge:
    alpha: 1.0
  xgboost:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: reg:squarederror
    tree_method: hist
    n_jobs: 10
  gru:
    hidden_size: 64
    num_layers: 1
    dropout: 0.0
    batch_size: 256
    learning_rate: 0.001
    weight_decay: 0.0001
    maximum_epochs: 30
    early_stopping_patience: 5
    minimum_delta: 0.0
    gradient_clip_norm: 1.0

statistics:
  primary_independent_unit: fold
  descriptive_units: [model_seed_horizon, day_horizon, spatial_block_day_horizon]
  spatial_blocks: 5
  bootstrap_replicates: 10000
  random_state: 2026
  holm_families_by_horizon: true
  prespecified_comparisons:
    - XGBoost_vs_GRU
    - XGBoost_vs_Ridge
    - XGBoost_vs_SeasonalHA
    - Persistence_vs_HA
    - GRU_vs_Ridge

governance:
  config_freeze_before_test_metrics: true
  formal_test_selection: prohibited
  result_driven_configuration_change: prohibited
  original_archives_modified: false
  ajse_primary_results_ready_before_final_audit: false
